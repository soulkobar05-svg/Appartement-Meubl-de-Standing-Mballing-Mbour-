<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Appartement Mballing Mbour</title>
    <style>
        :root {
            --primary: #163b67;
            --accent: #25D366;
            --accent-dark: #1ea85a;
            --secondary: #0a6fdd;
            --bg1: #f3f7ff;
            --bg2: #eefaf3;
            --card: #ffffff;
            --text: #1f2937;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            background: var(--card);
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            width: min(92%, 560px);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: clamp(1.8rem, 3vw, 2.7rem);
            margin-bottom: 12px;
        }

        .price {
            font-size: 1.2rem;
            margin: 20px 0 30px;
            color: #2b3d59;
            font-weight: 600;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1rem;
            padding: 16px 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .whatsapp-btn {
            background: var(--accent);
            color: white;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.28);
        }

        .whatsapp-btn:hover {
            box-shadow: 0 12px 24px rgba(37, 211, 102, 0.35);
        }

        .call-btn {
            background: var(--secondary);
            color: white;
            box-shadow: 0 8px 20px rgba(10, 111, 221, 0.25);
        }

        .call-btn:hover {
            box-shadow: 0 12px 24px rgba(10, 111, 221, 0.32);
        }

        .icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Appartement Meublé de Standing - Mballing</h1>
        <div class="price">Tarif : 65 000 FCFA / nuit</div>

        <div class="actions">
            <a href="https://wa.me/221775351143?text=Bonjour%2C%20je%20souhaite%20réserver%20l%27appartement." class="btn whatsapp-btn">
                <span class="icon">✆</span>
                <span>WhatsApp</span>
            </a>

            <a href="tel:+221775351143" class="btn call-btn">
                <span class="icon">📞</span>
                <span>Appeler maintenant</span>
            </a>
        </div>
    </div>
</body>
</html>
